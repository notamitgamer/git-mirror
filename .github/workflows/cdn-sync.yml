name: Sync to CDN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # required — this is what lets us prove who you are
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('cdn.amit.is-a.dev')
            core.setOutput('token', token)

      - name: Package repo contents
        run: tar --exclude='.git' -czf /tmp/payload.tar.gz .

      - name: Push to CDN
        run: |
          curl -sf -X POST https://cdn.amit.is-a.dev/api/gh-sync \
            -F "token=${{ steps.oidc.outputs.token }}" \
            -F "archive=@/tmp/payload.tar.gz"
