name: Build & Deploy Git Mirror

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '7 * * * *'          # hourly, off the top of the hour (GitHub delays :00 runs)
  workflow_dispatch:
  repository_dispatch:
    types: [mirror-refresh]

permissions:
  contents: read
  issues: read
  pull-requests: read
  deployments: read
  pages: write
  id-token: write
  actions: write                 # only used by the keep-alive step below

# Never cancel a run that is mid-deploy; GitHub keeps just the newest pending run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Bare clones + already-rendered pages. A repo whose HEAD/refs/metadata did not change is
      # copied from here instead of re-rendered, so most hourly runs finish in seconds.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: mirror-v2-${{ github.run_id }}
          restore-keys: mirror-v2-

      - name: Build site
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional overrides: Settings -> Secrets and variables -> Actions -> Variables
          MIRROR_USER: ${{ vars.MIRROR_USER }}
          MIRROR_EXCLUDE: ${{ vars.MIRROR_EXCLUDE || (github.repository == 'notamitgamer/git-mirror' && 'register,osma') || '' }}
          MIRROR_BASE_URL: ${{ vars.MIRROR_BASE_URL }}
          MIRROR_REBUILD_NOTE: ${{ vars.MIRROR_REBUILD_NOTE || (github.repository == 'notamitgamer/git-mirror' && 'rebuilt every 30 minutes') || '' }}
          MIRROR_BRANCHES: ${{ vars.MIRROR_BRANCHES }}
        run: python build.py

      # Only write a new cache entry when something actually changed.
      - name: Save build cache
        if: steps.build.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: mirror-v2-${{ github.run_id }}

      - uses: actions/configure-pages@v6

      # Packed by hand: upload-pages-artifact always drops ".github", which broke mirrored .github folders.
      - name: Pack site
        run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C site .

      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow through the API resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/main.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
