name: Generate & Deploy Git Mirror

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Stagit Binary
        id: cache-stagit
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/stagit*
          key: stagit-bin-v1

      - name: Compile Stagit (Only on cache miss)
        if: steps.cache-stagit.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libgit2-dev
          git clone git://git.codemadness.org/stagit /tmp/stagit
          cd /tmp/stagit && make CC=clang && sudo make install PREFIX=/usr/local

      - name: Cache Bare Repositories
        uses: actions/cache@v4
        with:
          path: raw_repos
          key: git-repos-cache-${{ github.run_id }}
          restore-keys: |
            git-repos-cache-

      - name: Run Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
